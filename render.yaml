# Render Blueprint for the Once Lost Media website (a static site).
# In Render: New > Blueprint, pick this repository, then fill in the two
# Supabase values when Render asks for them.
services:
  - type: web
    name: once-lost-media
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
    routes:
      # Send every page address to the app so links like /films/123 work on refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
